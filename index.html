<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Daily Summary Reports</title>

    <!-- XLSX Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Your updated JS file -->
    <script src="daily.js?v=5"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 10px;
            text-align: center;
        }

        #uploadSection {
            margin-bottom: 20px;
            text-align: center;
        }

        #dateHeader {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        table {
            width: auto;
            border-collapse: collapse;
            margin-left: auto;
            margin-right: auto;
            table-layout: auto;
        }

        th, td {
            padding: 8px;
            text-align: center;
            border: 1px solid #ccc;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <h2>Daily Summary Reports</h2>

    <div id="uploadSection">
        <input type="file" id="dailyFile" accept=".xlsx,.xls,.csv">
        <button onclick="runDailySummary()">Generate Summary</button>
    </div>

    <!-- Latest DOS -->
    <div id="dateHeader"></div>

    <h2>Summary by Location</h2>
    <table id="locTable"></table>

    <h2>Summary by Modality</h2>
    <table id="modTable"></table>

    <h2>Total Reported / Pending Read</h2>
    <table id="statusTable"></table>

    <h2>Backlog (All Dates Before Latest DOS)</h2>
    <table id="backlogTable"></table>

    <!-- ⭐ HISTORICAL SUMMARY TABLE -->
    <h2># Historical Exam Data</h2>
    <table id="historicalSummaryTable"></table>

    <!-- ⭐ INSERTED TABLE 1 -->
    <h2>Summary by Modality per Location</h2>
    <table id="modalityPerLocationTable"></table>

    <!-- ⭐ INSERTED TABLE 2 -->
    <h2>Summary No Show by Modality per Location</h2>
    <table id="noShowPerLocationTable"></table>

</body>
</html>
