<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Daily Summary Reports</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="daily.js?v=12"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }

        h2 {
            margin-top: 25px;
            margin-bottom: 10px;
        }

        #uploadSection {
            margin-bottom: 20px;
        }

        #dateHeader {
            font-size: 20px;
            margin-bottom: 20px;
        }

        table {
            width: auto;
            border-collapse: collapse;
            margin-left: auto;
            margin-right: auto;
        }

        th, td {
            padding: 8px;
            border: 1px solid #ccc;
            white-space: nowrap;
        }

        /* Wider columns, less wasted space */
        #reportContainer {
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: flex-start;
            width: 100%;
        }

        .column {
            width: 50%;
            margin-right: 0.5%;
        }
    </style>
</head>

<body>

    <h2>Daily Summary Reports</h2>

    <div id="uploadSection">
        <input type="file" id="dailyFile" accept=".xlsx,.xls,.csv">
        <button onclick="runDailySummary()">Generate Summary</button>
        <button onclick="downloadPDF()">Download PDF</button>
    </div>

    <div id="dateHeader"></div>

    <div id="reportContainer">
        <div id="leftColumn" class="column"></div>
        <div id="rightColumn" class="column"></div>
    </div>

    <div style="display:none;">
        <h2>Summary by Location</h2>
        <table id="locTable"></table>

        <h2>Summary by Modality</h2>
        <table id="modTable"></table>

        <h2># No Show Summary</h2>
        <table id="noShowSummaryTable"></table>

        <h2>Total Reported / Pending Read</h2>
        <table id="statusTable"></table>

        <h2>Backlog (All Dates Before Latest DOS)</h2>
        <table id="backlogTable"></table>

        <h2># Historical Exam Data</h2>
        <table id="historicalSummaryTable"></table>

        <h2>Summary by Modality per Location</h2>
        <table id="modalityPerLocationTable"></table>

        <h2>Summary No Show by Modality per Location</h2>
        <table id="noShowPerLocationTable"></table>
    </div>

</body>
</html>
