<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Daily Summary Reports</title>

    <!-- XLSX Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Your JS file -->
    <script src="daily.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 10px;
            text-align: center;
        }

        #uploadSection {
            margin-bottom: 20px;
            text-align: center;
        }

        #dateHeader {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        table {
            width: 80%;
            border-collapse: collapse;
            margin: 0 auto;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th, td {
            padding: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Daily Summary Reports</h2>

    <div id="uploadSection">
        <input type="file" id="dailyFile" accept=".xlsx,.xls,.csv">
        <button onclick="runDailySummary()">Generate Summary</button>
    </div>

    <!-- Latest DOS (end date) will appear here -->
    <div id="dateHeader"></div>

    <h2>Summary by Location</h2>
    <table id="locTable"></table>

    <h2>Summary by Modality</h2>
    <table id="modTable"></table>

    <h2>Total Reported / Pending Read</h2>
    <table id="statusTable"></table>

    <h2>Backlog (All Dates Before Latest DOS)</h2>
    <table id="backlogTable"></table>

    <h2>Historical Exam Data (All Dates Before Latest DOS)</h2>
    <table id="historicalTable"></table>

</body>
</html>
