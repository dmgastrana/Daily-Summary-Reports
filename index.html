<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Daily Summary</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="daily.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th, td {
            padding: 8px;
            text-align: left;
        }

        #dateHeader {
            font-size: 20px;
            margin-bottom: 20px;
        }

        #uploadSection {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div id="uploadSection">
        <h2>Upload RIS File</h2>
        <input type="file" id="dailyFile" accept=".xlsx,.xls">
        <button onclick="runDailySummary()">Run Summary</button>
    </div>

    <div id="dateHeader"></div>

    <h2>Summary by Location</h2>
    <table id="locTable"></table>

    <h2>Summary by Modality</h2>
    <table id="modTable"></table>

    <h2>Total Reported / Pending Read</h2>
    <table id="statusTable"></table>

    <h2>Backlog</h2>
    <table id="backlogTable"></table>

</body>
</html>
